<path d="M770,225 L805,225" stroke="#3d6b9a" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="210" y="375" width="780" height="160" rx="16" fill="#eaf2ff" stroke="#d6e0ed"/>
<text x="232" y="413" class="head">共同推进：设计、研发、产品</text>
