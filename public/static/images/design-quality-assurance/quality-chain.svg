<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="跨六国钱包：把一致性接进工作流程"><rect width="1200" height="650" rx="24" fill="#f5f7fb"/><style>text{font-family:Noto Sans CJK SC, sans-serif;fill:#17263d}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#53647b}.head{font-size:23px;font-weight:700}.body{font-size:19px}.label{font-size:17px;fill:#53647b}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#3d6b9a"/></marker></defs>
