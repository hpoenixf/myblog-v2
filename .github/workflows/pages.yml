# Inspired from https://github.com/actions/starter-workflows/blob/main/pages/nextjs.yml
name: GitHub Pages

on:
  push:
    branches: [main, candidate/blog-curation-20261029]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm
      - id: configurepages
        uses: actions/configure-pages@v5
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: Check personal blog selection
        run: node scripts/blog-curation.mjs .
      - name: Test reader release contract
        run: node --test scripts/reader-release.test.mjs scripts/check-tag-export.test.mjs scripts/blog-curation.test.mjs scripts/site-analytics.test.mjs scripts/site-analytics-integration.test.mjs
      - name: Resolve immutable reader release
        id: reader
        run: echo "commit=$(node scripts/reader-release.mjs pin)" >> "$GITHUB_OUTPUT"
      - run: pnpm build
        env:
          EXPORT: 1
          UNOPTIMIZED: 1
          BASE_PATH: ${{ steps.configurepages.outputs.base_path }}
      - name: Verify tag export URLs and pagination
        run: node scripts/check-tag-export.mjs out
      # hpoenixf.com is served by this Pages deployment, not by the article repo.
      # Include the independent VitePress site as a real subdirectory before upload.
      - name: Checkout ETF Agent reader
        uses: actions/checkout@v4
        with:
          repository: hpoenixf/eff-agent-article
          ref: ${{ steps.reader.outputs.commit }}
          path: reader-src
          persist-credentials: false
          fetch-depth: 0  # required by VitePress lastUpdated and git-dated RSS
      - name: Verify checked-out reader source
        run: node scripts/reader-release.mjs source reader-src
      - name: Install measured CJK diagram fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fontconfig
          fc-match -f '%{family}\n' 'Noto Sans CJK SC:lang=zh-cn'
      - name: Build and mount ETF Agent reader
        run: |
          cd reader-src
          node --test scripts/site-analytics.test.mjs scripts/site-analytics-integration.test.mjs
          PUPPETEER_SKIP_DOWNLOAD=1 npm install --no-audit --no-fund
          npm run check:catalog
          npm run docs:build
          cp -R visuals .vitepress/dist/visuals
          cd ..
          mkdir -p out/eff-agent-article
          cp -R reader-src/.vitepress/dist/. out/eff-agent-article/
          test -s out/eff-agent-article/index.html
          test -s out/eff-agent-article/en/index.html
          # The reviewed homepage must be SSR-rendered in both languages, not just present as client code.
          grep -q 'home-overview' out/eff-agent-article/index.html
          grep -q 'home-overview' out/eff-agent-article/en/index.html
          test -s out/eff-agent-article/sitemap.xml
          test -s out/eff-agent-article/feed.xml
          test -s out/eff-agent-article/en/feed.xml
          test -s out/eff-agent-article/generated/mermaid/manifest.json
          find out/eff-agent-article/generated/mermaid -maxdepth 1 -name '*.svg' | grep -q .
          grep -q 'assets/four-axes\.' out/eff-agent-article/articles/honest-agent-evaluation.html
          test -s out/eff-agent-article/visuals/panorama-evaluation/four-axes.svg
          grep -q 'assets/four-axes\.' out/eff-agent-article/en/articles/honest-agent-evaluation.html
          test -s out/eff-agent-article/visuals/en/panorama-evaluation/four-axes.svg
          grep -q 'github.com/hpoenixf/open-etf-agent' out/eff-agent-article/index.html
          grep -q 'github.com/hpoenixf/open-etf-agent' out/eff-agent-article/en/index.html
          test -s out/eff-agent-article/articles/022-agent-entry-from-intent-to-direct-research.html
          test -s out/eff-agent-article/visuals/owner-architecture/index.html
          grep -q 'https://hpoenixf.com/eff-agent-article/articles/022-agent-entry-from-intent-to-direct-research' out/eff-agent-article/articles/022-agent-entry-from-intent-to-direct-research.html
      - name: Stamp canonical reader release
        run: node scripts/reader-release.mjs stamp reader-src out/eff-agent-article
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact article bodies on the canonical domain
        timeout-minutes: 18
        run: node scripts/reader-release.mjs verify 900000

