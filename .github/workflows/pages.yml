# Inspired from https://github.com/actions/starter-workflows/blob/main/pages/nextjs.yml
name: GitHub Pages

on:
  push:
    branches: main
  workflow_dispatch:
  # Keep the custom-domain reading site current without cross-repository secrets.
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm
      - id: configurepages
        uses: actions/configure-pages@v5
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          EXPORT: 1
          UNOPTIMIZED: 1
          BASE_PATH: ${{ steps.configurepages.outputs.base_path }}
      # hpoenixf.com is served by this Pages deployment, not by the article repo.
      # Include the independent VitePress site as a real subdirectory before upload.
      - name: Checkout ETF Agent reader
        uses: actions/checkout@v4
        with:
          repository: hpoenixf/eff-agent-article
          ref: main
          path: reader-src
          persist-credentials: false
      - name: Build and mount ETF Agent reader
        run: |
          cd reader-src
          npm install --no-audit --no-fund
          npm run check:catalog
          npm run docs:build
          cp -R visuals .vitepress/dist/visuals
          cd ..
          mkdir -p out/eff-agent-article
          cp -R reader-src/.vitepress/dist/. out/eff-agent-article/
          test -s out/eff-agent-article/index.html
          test -s out/eff-agent-article/sitemap.xml
          test -s out/eff-agent-article/articles/022-agent-entry-from-intent-to-direct-research.html
          test -s out/eff-agent-article/visuals/owner-architecture/index.html
          grep -q 'https://hpoenixf.com/eff-agent-article/articles/022-agent-entry-from-intent-to-direct-research' out/eff-agent-article/articles/022-agent-entry-from-intent-to-direct-research.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
